[tool.poetry]
name = "zivid-nova"
version = "2.4.2"
description = "Nova plugin for Zivid 3D cameras."
authors = [
    "Patrick Schmager <patrick.schmager@wandelbots.com>",
    "André Kühnert <andre.kuehnert@wandelbots.com>",
    "Leonard Hansing <leonard.hansing@wandelbots.com",
]
include = [
    "zivid_nova"
]

[tool.poetry.dependencies]
python = ">=3.11, <=3.12.6"
fastapi = "^0.162.0"
uvicorn = "^0.30.6"
loguru = "^0.7.2"
python-decouple = "^3.8"
zivid = "2.14.1.2.14.1"
scipy = "^1.14.1"
pillow = "^13.0.0"
rerun-sdk = "^0.20.3"
# rerun-sdk 0.20 needs numpy<2. pyarrow 23 does not depend on numpy and works at runtime with numpy 1.26
pyarrow = "^23.0.1"
point-cloud-utils = "^0.31.0"
openexr = "^3.5.2"

[tool.poetry.extras]
all = ["zivid"]

[tool.poetry.group.dev.dependencies]
black = "^26.10.1"
pytest = "^9.0.3"
isort = "^5.13.2"
pylint = "^4.0.9"
mypy = "^1.10.0"
pytest-cov = "^7.1.0"
pytest-asyncio = "^1.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
serve = "zivid_nova:main"
generate-schema = "zivid_nova:generate_schema"

[tool.pytest.ini_options]
addopts = """
    --cov=zivid_nova
    --cov-report xml:reports/cov.xml
    --junitxml=reports/pytest.xml
    --import-mode=importlib"""
junit_family = "xunit2"
norecursedirs = "develop .ipynb_checkpoints .venv .tox *.egg"
testpaths = """
    tests
    docs
    zivid_nova
"""

[tool.black]
line-length = 120
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 120
